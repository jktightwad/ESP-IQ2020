##########################################################################
# Standalone hot tub controller - no Home Assistant required.
#
# This is the same IQ2020 protocol component used everywhere else in this
# repo, but wired up so the ESP32 is the whole product: it serves its own
# custom control page (www/hot-tub.js + www/hot-tub.css, modeled on the
# physical Spa Control panel, with native Fahrenheit throughout) and JSON/
# REST API over WiFi, instead of relying on Home Assistant's native "api:"
# integration or ESPHome's default auto-generated dashboard. No login -
# open to anyone on the same network.
#
# Hardware assumed below: the Waveshare ESP32-S3-RS485-CAN board (ESP32-S3-
# WROOM-1, 16MB flash, 8MB PSRAM). It has an isolated RS485 transceiver and
# a 7-36V DC screw terminal built in, so the tub's 12V wires straight into
# it - no separate RS485 module, level shifting, or buck converter needed.
# See documentation/standalone.md for wiring notes and documentation/
# devices.md if you'd rather use different ESP32 hardware (pins differ).
##########################################################################

esphome:
  name: hot-tub
  friendly_name: Hot Tub

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: arduino

# This board's WROOM-1 module has 8MB of octal PSRAM - enabling it gives
# plenty of headroom for web_server plus the full set of entities below.
psram:
  mode: octal

logger:
  baud_rate: 0
  level: ERROR

# No "api:" block on purpose - that component is the Home Assistant native
# API. Skipping it means this device never talks to, or depends on, a
# Home Assistant instance.

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # If the configured WiFi can't be reached (e.g. router down, moved the
  # tub), the ESP32 falls back to its own access point so you can still
  # get to it and fix the config instead of it going dark.
  ap:
    ssid: "Hot Tub Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

# Local time source so the device has a real clock without needing Home
# Assistant (used for the IQ2020 real-time clock and on-device schedules
# like the daily Clean Cycle below). Change the timezone to your own.
time:
  - platform: sntp
    id: sntp_time
    timezone: America/Los_Angeles
    on_time:
      # Runs Clean Cycle once a day. The tub handles the actual 10-minute
      # run and auto-off itself (same as pressing Start on the physical
      # remote) - this just triggers it. Change the hour/minute to taste.
      - seconds: 0
        minutes: 0
        hours: 5
        then:
          - switch.turn_on: clean_cycle_switch

# This is the standalone control surface: a custom control page modeled on
# the physical Spa Control panel, plus the JSON/REST API it runs on,
# served directly by the ESP32 at http://hot-tub.local/ (or its IP
# address). No login - anyone on the same network can open and use it.
# css_url/js_url are blanked out so the default ESPHome dashboard doesn't
# load at all; css_include/js_include serve our own page instead.
web_server:
  version: 3
  port: 80
  css_url: ""
  css_include: "www/hot-tub.css"
  js_url: ""
  js_include: "www/hot-tub.js"

# refresh: 0s forces a fresh fetch on every build instead of caching the
# clone for a day (ESPHome's default) - worth keeping while this project
# is under active development so a build always reflects the latest push.
external_components:
  - source: github://jktightwad/HotSprings_ControlPanel
    refresh: 0s

# Pins for the Waveshare ESP32-S3-RS485-CAN board's onboard RS485
# transceiver. GPIO21 is its direction/enable pin, wired internally to the
# transceiver - nothing extra to wire up for flow control.
uart:
  id: SpaConnection
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 38400
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024

iq2020:
  uart_id: SpaConnection
  flow_control_pin: GPIO21
  polling_rate: 65
  # Optional raw RS485 traffic viewer port for the IQ2020 DataViewer tool
  # (see DataViewer/) - useful for debugging, has nothing to do with HA.
  port: 1234

# If your hot tub remote displays Celsius, replace "_f_" with "_c_" below
# and set "celsius: true" in the climate section.
sensor:
  - platform: iq2020
    current_f_temperature:
      name: Current Temperature
    target_f_temperature:
      name: Target Temperature
    outlet_f_temperature:
      name: Heater Outlet
    pcb_f_temperature:
      name: Controller Temperature
    power_l1:
      name: Pumps Power
    power_heater:
      name: Controller Power
    power_l2:
      name: Heater Power
    # Required alongside the audio entities below - see documentation/audio.md
    buttons:
      name: Buttons

switch:
  - platform: iq2020
    name: Lights
    id: lights_switch
    icon: "mdi:lightbulb"
    datapoint: 0
  - platform: iq2020
    name: Spa Lock
    id: spa_lock_switch
    icon: "mdi:lock"
    datapoint: 1
  - platform: iq2020
    name: Temperature Lock
    id: temp_lock_switch
    icon: "mdi:lock"
    datapoint: 2
  - platform: iq2020
    name: Clean Cycle
    id: clean_cycle_switch
    icon: "mdi:vacuum"
    datapoint: 3
  - platform: iq2020
    name: Summer Timer
    id: summer_timer_switch
    icon: "mdi:sun-clock"
    datapoint: 4
  # Real Bluetooth/subwoofer audio module - see documentation/audio.md
  - platform: iq2020
    name: Audio
    id: audio_power
    icon: "mdi:speaker"
    datapoint: 9

# Audio source options are fixed in the component itself (iPod/TV/Aux/
# Bluetooth) regardless of what's listed here. Light color/cycle options
# below match the tub's actual settings 1-for-1.
select:
  - platform: iq2020
    name: Audio Source
    id: audio_source
    datapoint: 0
  - platform: iq2020
    name: Color Underwater
    id: lights1_color
    datapoint: 1
    options: [Violet, Blue, Cyan, Green, White, Yellow, Red, Cycle]
  - platform: iq2020
    name: Color Bartop
    id: lights2_color
    datapoint: 2
    options: [Violet, Blue, Cyan, Green, White, Yellow, Red, Cycle]
  - platform: iq2020
    name: Color Pillow
    id: lights3_color
    datapoint: 3
    options: [Violet, Blue, Cyan, Green, White, Yellow, Red, Cycle]
  - platform: iq2020
    name: Color Exterior
    id: lights4_color
    datapoint: 4
    options: [Violet, Blue, Cyan, Green, White, Yellow, Red, Cycle]
  - platform: iq2020
    name: Color Cycle Speed
    id: lights_cycle_speed
    datapoint: 5
    options: ["Off", Slow, Normal, Fast]

# Ranges (including that Treble/Bass/Balance are -5 to +5) are hardcoded
# in the component itself based on datapoint number, not configurable here
# - only "datapoint" and, for light intensities, "maximum" are read from
# this platform's config. A firmware bug on the IQ2020 side means negative
# Treble/Bass/Balance values can't be set from software (only read back if
# set from the physical remote) - see documentation/audio.md "Known Issues".
number:
  - platform: iq2020
    name: Volume
    id: audio_volume
    datapoint: 0
  - platform: iq2020
    name: Treble
    id: audio_treble
    datapoint: 1
  - platform: iq2020
    name: Bass
    id: audio_bass
    datapoint: 2
  - platform: iq2020
    name: Balance
    id: audio_balance
    datapoint: 3
  - platform: iq2020
    name: Subwoofer
    id: audio_subwoofer
    datapoint: 4
  - platform: iq2020
    id: lights1_intensity
    name: Intensity Underwater
    datapoint: 7
    maximum: 5
  - platform: iq2020
    id: lights2_intensity
    name: Intensity Bartop
    datapoint: 8
    maximum: 5
  - platform: iq2020
    id: lights3_intensity
    name: Intensity Pillow
    datapoint: 9
    maximum: 5
  - platform: iq2020
    id: lights4_intensity
    name: Intensity Exterior
    datapoint: 10
    maximum: 5

text:
  - platform: iq2020
    name: Song Title
    id: song_title
    datapoint: 0
    mode: text
  - platform: iq2020
    name: Artist Name
    id: artist_name
    datapoint: 1
    mode: text

# Sends "01 1F 40 1900 02xx" per documentation/protocol.md. Pause confirmed
# working against real playback (genuinely paused Spotify) - see the
# comment in IQ2020Component::buttonAction() in iq2020.cpp for the one
# side effect this uncovered and how it's handled.
button:
  - platform: iq2020
    name: Play
    id: audio_play
    datapoint: 3
  - platform: iq2020
    name: Pause
    id: audio_pause
    datapoint: 4
  - platform: iq2020
    name: Next
    id: audio_next
    datapoint: 5
  - platform: iq2020
    name: Back
    id: audio_back
    datapoint: 6

fan:
  - platform: iq2020
    name: Jets 1
    id: jets1
    icon: "mdi:turbine"
    datapoint: 0
    speeds: 1
  - platform: iq2020
    name: Jets 2
    id: jets2
    icon: "mdi:turbine"
    datapoint: 1
    speeds: 2

climate:
  - platform: iq2020
    id: hottub_climate
    name: Temperature
    celsius: false

text_sensor:
  - platform: iq2020
    versionstr:
      name: Version
